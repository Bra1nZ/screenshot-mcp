[project]
name = "screenshot-mcp"
version = "0.1.0"
description = "MCP server for KDE Plasma 6 / Wayland: agent-driven terminal windows and desktop captures"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["mcp>=1.29,<2"]

[project.urls]
Repository = "https://github.com/Bra1nZ/screenshot-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "S101",    # assert в тестах — норма
    "S603",    # subprocess вызывается с фиксированным списком аргументов, без shell
    "S606",    # то же: shell=True нигде не используется
    "S607",    # запуск по имени из PATH — для системных утилит это норма
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM117"]
"tools/*" = ["S603", "S607"]
